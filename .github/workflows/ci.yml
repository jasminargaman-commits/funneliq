name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (syntax check)
        run: python -m py_compile app/main.py scripts/*.py

      - name: Smoke test -- import the API and load all models
        run: python -c "from app.main import app; print('app imported OK, all models loaded')"
